services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VITE_BASE_URL_API: /api
    ports:
      - "3000:3000"
    networks:
      - operix-network

networks:
  operix-network:
    driver: bridge
