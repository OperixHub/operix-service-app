<!DOCTYPE html>
<html lang="pt-BR">

<head>
      <meta charset="UTF-8">
      <link rel="icon" href="/layout/images/opeflow-icon.svg" type="image/svg+xml">
      <meta name="theme-color" content="#0f766e">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Opeflow</title>
      <link id="theme-css" rel="stylesheet" type="text/css" href="/themes/lara-light-blue/theme.css">
      <script>
            if (localStorage.getItem('opeflow_theme') === 'dark' ||
                  (!localStorage.getItem('opeflow_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                  document.getElementById('theme-css').href = '/themes/lara-dark-blue/theme.css';
                  document.documentElement.style.colorScheme = 'dark';
            }
      </script>
      <link rel="manifest" href="/manifest.json">
</head>

<body>
      <div id="app"></div>
      <script type="module" src="/src/main.js"></script>
</body>

</html>
